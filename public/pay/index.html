<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrueStay Pay</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#E8EBE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TS Pay">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=4">
<script>
  // apply saved theme before first paint so dark mode never flashes light
  try { var t = localStorage.getItem("tsp.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div id="root">
  <div class="splash"><div class="coin-logo big">£</div></div>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=4"></script>
</body>
</html>
